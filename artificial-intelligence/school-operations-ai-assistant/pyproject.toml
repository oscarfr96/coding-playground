[project]
name = "school-operations-ai-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy>=2.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
