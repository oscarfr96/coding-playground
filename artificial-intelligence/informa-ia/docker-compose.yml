services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: informa
      POSTGRES_PASSWORD: informa        # solo desarrollo local
      POSTGRES_DB: informa
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U informa -d informa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
